<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7fb">
    <title>FinanzApp | Tus finanzas claras</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17233c;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --navy: #14213d;
        --muted: #74809a;
        --line: #e8ecf3;
        --green: #17865c;
        --red: #d65050;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: #f5f7fb; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      .shell { max-width: 760px; margin: 0 auto; padding: 28px 20px calc(40px + env(safe-area-inset-bottom)); }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
      .logo { display: grid; width: 46px; height: 46px; place-items: center; border-radius: 15px; color: white; background: var(--navy); font-size: 23px; font-weight: 800; }
      h1 { margin: 0; color: var(--navy); font-size: 21px; letter-spacing: -.5px; }
      .tagline { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
      .eyebrow { margin: 0 0 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
      .balance-card { padding: 24px; border-radius: 22px; color: white; background: linear-gradient(135deg, #14213d, #263d68); box-shadow: 0 14px 34px #14213d24; }
      .balance-card .eyebrow { color: #c5d0e4; }
      .balance { margin: 0; font-size: clamp(32px, 9vw, 42px); font-weight: 750; letter-spacing: -1.5px; overflow-wrap: anywhere; }
      .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 28px; }
      .summary-card { min-width: 0; padding: 17px; border: 1px solid var(--line); border-radius: 17px; background: white; }
      .summary-title { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 600; }
      .summary-value { margin: 10px 0 0; font-size: clamp(17px, 5vw, 21px); font-weight: 700; overflow-wrap: anywhere; }
      .summary-value.income { color: var(--green); }
      .summary-value.expense { color: var(--red); }
      .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
      h2 { margin: 0; color: var(--navy); font-size: 18px; letter-spacing: -.3px; }
      .primary-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 15px; border: 0; border-radius: 12px; color: white; background: var(--navy); font-size: 13px; font-weight: 700; }
      .primary-button:active { transform: translateY(1px); }
      .panel { padding: 19px; border: 1px solid var(--line); border-radius: 18px; background: white; }
      .form-panel { margin-bottom: 23px; }
      .form-panel[hidden] { display: none; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 16px; }
      .field { display: grid; gap: 7px; }
      .field.full { grid-column: 1 / -1; }
      label { color: #58657e; font-size: 12px; font-weight: 650; }
      input, select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #dfe5ef; border-radius: 11px; outline: none; color: #17233c; background: white; }
      input:focus, select:focus { border-color: #667da8; box-shadow: 0 0 0 3px #667da81c; }
      .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 16px; }
      .secondary-button { min-height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px; color: #58657e; background: white; font-weight: 650; }
      .transaction-list { display: grid; gap: 9px; }
      .transaction { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: white; }
      .transaction-icon { display: grid; flex: 0 0 39px; width: 39px; height: 39px; place-items: center; border-radius: 13px; background: #f0f3f8; font-size: 17px; }
      .transaction-info { flex: 1; min-width: 0; }
      .transaction-name { margin: 0; overflow: hidden; color: #25314a; font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .transaction-meta { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
      .transaction-right { text-align: right; }
      .transaction-amount { margin: 0; font-size: 14px; font-weight: 750; white-space: nowrap; }
      .transaction-amount.income { color: var(--green); }
      .transaction-amount.expense { color: var(--red); }
      .delete-button { margin-top: 4px; padding: 2px 0; border: 0; color: var(--muted); background: transparent; font-size: 11px; text-decoration: underline; }
      .empty-state { padding: 30px 18px; color: var(--muted); text-align: center; }
      .empty-icon { margin-bottom: 9px; font-size: 29px; }
      .empty-state p { margin: 0; font-size: 13px; line-height: 1.5; }
      .notice { margin: 0 0 14px; padding: 11px 13px; border: 1px solid #f1d8a8; border-radius: 11px; color: #795512; background: #fff9eb; font-size: 12px; line-height: 1.45; }
      .notice[hidden] { display: none; }
      @media (max-width: 420px) {
        .shell { padding-right: 15px; padding-left: 15px; }
        .balance-card { padding: 21px; }
        .summary-card { padding: 14px 12px; }
        .section-heading { align-items: flex-start; }
        .primary-button { padding: 0 11px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="logo" aria-hidden="true">$</div>
        <div>
          <h1>FinanzApp</h1>
          <p class="tagline">Tus finanzas, claras y en un solo lugar</p>
        </div>
      </header>

      <section class="balance-card" aria-label="Resumen de saldo">
        <p class="eyebrow">Saldo disponible</p>
        <p class="balance" id="balance">$0.00</p>
      </section>

      <section class="summary" aria-label="Resumen de movimientos">
        <article class="summary-card">
          <div class="summary-title"><span aria-hidden="true">↗</span> Ingresos</div>
          <p class="summary-value income" id="income-total">$0.00</p>
        </article>
        <article class="summary-card">
          <div class="summary-title"><span aria-hidden="true">↘</span> Gastos</div>
          <p class="summary-value expense" id="expense-total">$0.00</p>
        </article>
      </section>

      <section class="form-panel panel" id="form-panel" hidden aria-labelledby="form-title">
        <h2 id="form-title">Nuevo movimiento</h2>
        <form id="transaction-form">
          <div class="form-grid">
            <div class="field">
              <label for="type">Tipo</label>
              <select id="type" name="type" required>
                <option value="expense">Gasto</option>
                <option value="income">Ingreso</option>
              </select>
            </div>
            <div class="field">
              <label for="amount">Cantidad</label>
              <input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required>
            </div>
            <div class="field full">
              <label for="description">Descripción</label>
              <input id="description" name="description" type="text" maxlength="60" placeholder="Ej. Compra del supermercado" required>
            </div>
            <div class="field">
              <label for="category">Categoría</label>
              <select id="category" name="category" required>
                <option>Comida</option>
                <option>Transporte</option>
                <option>Vivienda</option>
                <option>Salud</option>
                <option>Entretenimiento</option>
                <option>Salario</option>
                <option>Otros</option>
              </select>
            </div>
            <div class="field">
              <label for="date">Fecha</label>
              <input id="date" name="date" type="date" required>
            </div>
          </div>
          <div class="form-actions">
            <button class="secondary-button" id="cancel-button" type="button">Cancelar</button>
            <button class="primary-button" type="submit">Guardar movimiento</button>
          </div>
        </form>
      </section>

      <p class="notice" id="storage-notice" role="status" hidden></p>

      <section aria-labelledby="transactions-title">
        <div class="section-heading">
          <h2 id="transactions-title">Movimientos recientes</h2>
          <button class="primary-button" id="add-button" type="button"><span aria-hidden="true">＋</span> Agregar</button>
        </div>
        <div class="transaction-list" id="transaction-list" aria-live="polite"></div>
      </section>
    </main>

    <script>
      (() => {
        const STORAGE_KEY = "finanzapp.transactions.v1";
        const list = document.getElementById("transaction-list");
        const formPanel = document.getElementById("form-panel");
        const form = document.getElementById("transaction-form");
        const dateField = document.getElementById("date");
        const notice = document.getElementById("storage-notice");
        const amountFormatter = new Intl.NumberFormat("es", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
        let transactions = [];

        const formatAmount = (value) => "$" + amountFormatter.format(value);
        const localDate = () => {
          const now = new Date();
          return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        };
        const showNotice = (message) => {
          notice.textContent = message;
          notice.hidden = false;
        };

        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved !== null) {
            const parsed = JSON.parse(saved);
            if (!Array.isArray(parsed) || parsed.some((item) =>
              !item || typeof item.id !== "string" ||
              (item.type !== "income" && item.type !== "expense") ||
              typeof item.description !== "string" ||
              typeof item.category !== "string" ||
              typeof item.date !== "string" ||
              typeof item.amount !== "number" ||
              !Number.isFinite(item.amount) || item.amount <= 0
            )) {
              throw new Error("Los movimientos guardados tienen un formato no válido.");
            }
            transactions = parsed;
          }
        } catch (error) {
          showNotice("No se pudieron leer los movimientos guardados. Puedes seguir usando la app; los nuevos movimientos se guardarán cuando el almacenamiento esté disponible.");
          console.error("No se pudo cargar el almacenamiento local de FinanzApp:", error);
        }

        const render = () => {
          const income = transactions.reduce((sum, item) => item.type === "income" ? sum + item.amount : sum, 0);
          const expenses = transactions.reduce((sum, item) => item.type === "expense" ? sum + item.amount : sum, 0);
          document.getElementById("balance").textContent = formatAmount(income - expenses);
          document.getElementById("income-total").textContent = formatAmount(income);
          document.getElementById("expense-total").textContent = formatAmount(expenses);

          list.replaceChildren();
          if (transactions.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-state panel";
            const icon = document.createElement("div");
            icon.className = "empty-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = "📊";
            const message = document.createElement("p");
            message.textContent = "Aún no tienes movimientos. Agrega tu primer ingreso o gasto para ver tu resumen.";
            empty.append(icon, message);
            list.append(empty);
            return;
          }

          const sorted = [...transactions].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
          for (const item of sorted) {
            const row = document.createElement("article");
            row.className = "transaction";
            const icon = document.createElement("div");
            icon.className = "transaction-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = item.type === "income" ? "↙" : "↗";
            const info = document.createElement("div");
            info.className = "transaction-info";
            const description = document.createElement("p");
            description.className = "transaction-name";
            description.textContent = item.description;
            const metadata = document.createElement("p");
            metadata.className = "transaction-meta";
            metadata.textContent = item.category + " · " + new Intl.DateTimeFormat("es", { dateStyle: "medium" }).format(new Date(item.date + "T12:00:00"));
            info.append(description, metadata);
            const right = document.createElement("div");
            right.className = "transaction-right";
            const amount = document.createElement("p");
            amount.className = "transaction-amount " + item.type;
            amount.textContent = (item.type === "income" ? "+" : "−") + formatAmount(item.amount);
            const remove = document.createElement("button");
            remove.className = "delete-button";
            remove.type = "button";
            remove.textContent = "Eliminar";
            remove.setAttribute("aria-label", "Eliminar " + item.description);
            remove.addEventListener("click", () => {
              if (!window.confirm("¿Eliminar este movimiento?")) return;
              saveTransactions(transactions.filter((entry) => entry.id !== item.id));
            });
            right.append(amount, remove);
            row.append(icon, info, right);
            list.append(row);
          }
        };

        const saveTransactions = (next) => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
            transactions = next;
            notice.hidden = true;
            render();
          } catch (error) {
            showNotice("No se pudo guardar el movimiento en este dispositivo. Comprueba el espacio disponible e inténtalo de nuevo.");
            console.error("No se pudo guardar el almacenamiento local de FinanzApp:", error);
          }
        };

        document.getElementById("add-button").addEventListener("click", () => {
          formPanel.hidden = false;
          dateField.value = localDate();
          document.getElementById("description").focus();
          formPanel.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        document.getElementById("cancel-button").addEventListener("click", () => {
          form.reset();
          formPanel.hidden = true;
        });
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (!form.reportValidity()) return;
          const data = new FormData(form);
          const amount = Number(data.get("amount"));
          if (!Number.isFinite(amount) || amount <= 0) {
            document.getElementById("amount").setCustomValidity("Ingresa una cantidad mayor que cero.");
            document.getElementById("amount").reportValidity();
            return;
          }
          const transaction = {
            id: Date.now().toString() + "-" + Math.random().toString(36).slice(2),
            type: data.get("type"),
            amount,
            description: String(data.get("description")).trim(),
            category: data.get("category"),
            date: data.get("date")
          };
          if (!transaction.description || !transaction.date) return;
          saveTransactions([...transactions, transaction]);
          form.reset();
          formPanel.hidden = true;
        });
        document.getElementById("amount").addEventListener("input", (event) => {
          event.currentTarget.setCustomValidity("");
        });

        dateField.value = localDate();
        render();
      })();
    </script>
  </body>
</html>
